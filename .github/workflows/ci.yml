name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  qa:
    name: Quality Assurance (PHPStan, CS-Fixer, Rector, Tests)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: xdebug

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan (Static Analysis)
        run: composer analyse

      - name: Check Code Style (PHP-CS-Fixer)
        run: composer run format:check

      - name: Check Rector (dry-run)
        run: composer run rector:check

      - name: Run Tests (PHPUnit)
        run: composer test

      - name: Check Coverage (100% required)
        run: composer run coverage:check
